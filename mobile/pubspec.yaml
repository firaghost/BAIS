name: Attendance
description: "SDB Attendance Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  provider: ^6.1.0
  shared_preferences: ^2.3.0
  geolocator: ^13.0.2
  intl: ^0.20.2
  local_auth: ^2.3.0
  google_fonts: ^6.2.0
  flutter_secure_storage: ^9.2.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  image_picker: ^1.1.2
  path_provider: ^2.1.2
  image: ^4.8.0
  flutter_native_splash: ^2.4.7
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/splash.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  background_image: "assets/splash.png"
  android: true
  ios: true
  android_gravity: fill
  ios_content_mode: scaleAspectFill
  fullscreen: true
  android_12:
    color: "#FFFFFF"
    background_image: "assets/splash.png"
